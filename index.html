<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>
醫奈所會議室預約系統
</title>


<style>

:root {

    --primary-color: #2b6cb0;

    --primary-dark: #1f4f85;

    --booked-bg: #fff5f5;

    --booked-text: #e53e3e;

    --success: #38a169;

    --bg-color: #f7fafc;

}


* {
    box-sizing: border-box;
}


body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:
        var(--bg-color);

    margin: 0;

    padding: 15px;

    color: #2d3748;

}


.container {

    max-width: 1000px;

    margin: 0 auto;

    background: white;

    padding: 20px;

    border-radius: 12px;

    box-shadow:
        0 4px 6px rgba(0,0,0,0.05);

}


h1 {

    text-align: center;

    color:
        var(--primary-color);

    margin:
        0 0 20px;

    font-size: 24px;

}


/* ==========================================
   會議室
========================================== */

.room-tabs {

    display: flex;

    gap: 10px;

    margin-bottom: 20px;

    border-bottom:
        2px solid #e2e8f0;

    padding-bottom: 10px;

}


.tab-btn {

    flex: 1;

    padding: 12px;

    font-size: 16px;

    font-weight: bold;

    border:
        1px solid #cbd5e0;

    border-radius:
        8px 8px 0 0;

    background: #edf2f7;

    color: #4a5568;

    cursor: pointer;

    transition: 0.2s;

}


.tab-btn:hover {

    background: #e2e8f0;

}


.tab-btn.active {

    background:
        var(--primary-color);

    color: white;

    border-color:
        var(--primary-color);

}


/* ==========================================
   我的預約
========================================== */

.my-booking-area {

    display: flex;

    justify-content: flex-end;

    margin-bottom: 15px;

}


.my-booking-btn {

    border: none;

    background:
        #805ad5;

    color: white;

    padding: 9px 14px;

    border-radius: 6px;

    cursor: pointer;

    font-weight: bold;

}


.my-booking-btn:hover {

    background:
        #6b46c1;

}


/* ==========================================
   月曆控制
========================================== */

.calendar-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;

    background: #f8fafc;

    padding: 12px;

    border-radius: 8px;

    border:
        1px solid #e2e8f0;

}


.calendar-header h2 {

    margin: 0;

    font-size: 18px;

    color: #4a5568;

}


.nav-btn {

    background: white;

    border:
        1px solid #cbd5e0;

    padding: 7px 12px;

    border-radius: 6px;

    cursor: pointer;

    font-weight: bold;

}


.nav-btn:hover {

    background: #edf2f7;

}


/* ==========================================
   月曆
========================================== */

.calendar-grid {

    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    gap: 8px;

}


.weekday-label {

    text-align: center;

    font-weight: bold;

    padding: 8px 0;

    background: #edf2f7;

    color: #718096;

    border-radius: 4px;

    font-size: 14px;

}


.calendar-day {

    min-height: 110px;

    border:
        1px solid #e2e8f0;

    border-radius: 6px;

    padding: 6px;

    background: white;

    display: flex;

    flex-direction: column;

    cursor: pointer;

    transition: 0.1s;

}


.calendar-day:hover {

    background:
        #f7fafc;

    border-color:
        #cbd5e0;

}


.calendar-day.empty {

    background:
        #fafafa;

    cursor: default;

    border: none;

}


.calendar-day.today {

    border:
        2px solid
        var(--primary-color);

    background:
        #f0f7ff;

}


.day-number {

    font-weight: bold;

    font-size: 14px;

    margin-bottom: 5px;

    color: #4a5568;

}


.event-list {

    flex-grow: 1;

    display: flex;

    flex-direction: column;

    gap: 3px;

    overflow-y: auto;

    max-height: 80px;

}


.event-item {

    font-size: 11px;

    padding: 3px 5px;

    border-radius: 3px;

    background:
        var(--booked-bg);

    color:
        var(--booked-text);

    border-left:
        3px solid
        var(--booked-text);

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* ==========================================
   Loading
========================================== */

.loading {

    text-align: center;

    padding: 30px;

    color: #718096;

}


/* ==========================================
   Modal
========================================== */

.modal {

    display: none;

    position: fixed;

    inset: 0;

    width: 100%;

    height: 100%;

    background:
        rgba(0,0,0,0.5);

    justify-content: center;

    align-items: center;

    z-index: 1000;

}


.modal-content {

    background: white;

    padding: 25px;

    border-radius: 8px;

    width: 90%;

    max-width: 480px;

    max-height: 90vh;

    overflow-y: auto;

    box-shadow:
        0 10px 25px
        rgba(0,0,0,0.15);

}


.modal-title {

    margin-top: 0;

    color:
        var(--primary-color);

}


/* ==========================================
   Form
========================================== */

.form-group {

    margin-bottom: 12px;

}


.form-group label {

    display: block;

    margin-bottom: 5px;

    font-weight: bold;

    font-size: 14px;

}


.form-group input,

.form-group select {

    width: 100%;

    padding: 9px;

    border:
        1px solid #cbd5e0;

    border-radius: 6px;

    font-size: 14px;

    background: white;

}


.form-group input:focus,

.form-group select:focus {

    outline: none;

    border-color:
        var(--primary-color);

    box-shadow:
        0 0 0 2px
        rgba(43,108,176,0.1);

}


/* ==========================================
   連續時間
========================================== */

.time-preview {

    background:
        #ebf8ff;

    color:
        #2c5282;

    border:
        1px solid #bee3f8;

    padding: 10px;

    border-radius: 6px;

    font-size: 13px;

    margin-top: 8px;

}


.time-preview strong {

    color:
        var(--primary-color);

}


/* ==========================================
   已預約
========================================== */

.booked-list {

    max-height: 180px;

    overflow-y: auto;

    background:
        #fff5f5;

    border:
        1px solid #feb2b2;

    padding: 8px;

    border-radius: 6px;

    display: flex;

    flex-direction: column;

    gap: 5px;

}


.booked-item {

    background: white;

    padding: 7px 8px;

    border:
        1px solid #fee2e2;

    border-radius: 4px;

    font-size: 13px;

}


/* ==========================================
   Buttons
========================================== */

.modal-buttons {

    display: flex;

    justify-content: flex-end;

    gap: 10px;

    margin-top: 15px;

}


.action-btn {

    padding: 9px 16px;

    border: none;

    border-radius: 6px;

    font-weight: bold;

    cursor: pointer;

}


.btn-close {

    background:
        #edf2f7;

    color:
        #4a5568;

}


.btn-reserve {

    background:
        var(--primary-color);

    color: white;

}


.btn-reserve:hover {

    background:
        var(--primary-dark);

}


.btn-purple {

    background:
        #805ad5;

    color: white;

}


.btn-danger {

    background:
        #e53e3e;

    color: white;

}


.btn-success {

    background:
        #38a169;

    color: white;

}


/* ==========================================
   取消碼
========================================== */

.cancel-code-box {

    background:
        #f0fff4;

    border:
        1px solid #9ae6b4;

    border-radius: 8px;

    padding: 14px;

    text-align: center;

    margin:
        10px 0 15px;

}


.cancel-code {

    font-size: 28px;

    font-weight: bold;

    letter-spacing: 4px;

    color:
        #276749;

    margin: 8px 0;

}


.warning-text {

    font-size: 12px;

    color:
        #744210;

    background:
        #fffaf0;

    border:
        1px solid #fbd38d;

    padding: 8px;

    border-radius: 5px;

}


/* ==========================================
   查詢結果
========================================== */

.booking-result {

    border:
        1px solid #e2e8f0;

    border-radius: 8px;

    padding: 12px;

    margin-bottom: 10px;

    background:
        #f8fafc;

}


.booking-result-title {

    font-weight: bold;

    color:
        var(--primary-color);

    margin-bottom: 8px;

}


.booking-result-time {

    font-size: 18px;

    font-weight: bold;

    margin:
        5px 0;

}


.booking-result-info {

    font-size: 13px;

    color:
        #4a5568;

}


/* ==========================================
   Mobile
========================================== */

@media(max-width:600px) {

    body {

        padding: 8px;

    }


    .container {

        padding: 12px;

    }


    h1 {

        font-size: 20px;

    }


    .tab-btn {

        font-size: 13px;

        padding: 10px 5px;

    }


    .calendar-grid {

        gap: 3px;

    }


    .calendar-day {

        min-height: 75px;

        padding: 4px;

    }


    .event-item {

        font-size: 9px;

    }


    .nav-btn {

        font-size: 12px;

        padding: 5px 8px;

    }


    .my-booking-area {

        justify-content: stretch;

    }


    .my-booking-btn {

        width: 100%;

    }


    .modal-content {

        padding: 18px;

    }


    .calendar-header h2 {

        font-size: 15px;

    }

}

</style>

</head>


<body>


<div class="container">


<h1>
🏢 辦公室會議室預約系統
</h1>


<!-- ==========================================
     會議室
========================================== -->

<div class="room-tabs">


<button
    class="tab-btn active"
    id="btn-R1-2013"
    onclick="switchRoom('R1-2013')">

📍 R1-2013 會議室

</button>


<button
    class="tab-btn"
    id="btn-R1-3013"
    onclick="switchRoom('R1-3013')">

📍 R1-3013 會議室

</button>


</div>


<!-- ==========================================
     我的預約
========================================== -->

<div class="my-booking-area">

<button
    class="my-booking-btn"
    onclick="openMyBookingModal()">

🔍 我的預約 / 取消預約

</button>

</div>


<!-- ==========================================
     月曆
========================================== -->

<div class="calendar-header">


<button
    class="nav-btn"
    onclick="moveMonth(-1)">

◀ 上個月

</button>


<h2 id="calendar-month-year">
載入中...
</h2>


<button
    class="nav-btn"
    onclick="moveMonth(1)">

下個月 ▶

</button>


</div>


<div
    id="calendar-grid"
    class="calendar-grid">

<div class="loading"
     style="grid-column:1/-1;">

正在讀取預約資料...

</div>

</div>


</div>


<!-- ==================================================
     預約 Modal
================================================== -->

<div
    class="modal"
    id="booking-modal">


<div class="modal-content">


<h3 class="modal-title">

📅 預約與狀況

</h3>


<div class="form-group">

<label>
預約空間
</label>

<input
    type="text"
    id="modal-room-display"
    readonly
    style="background:#edf2f7;">

</div>


<div class="form-group">

<label>
預約日期
</label>

<input
    type="text"
    id="modal-date-display"
    readonly
    style="background:#edf2f7;">

</div>


<div class="form-group">

<label style="color:#e53e3e;">

⚠️ 該日已預約時段

</label>


<div
    id="modal-booked-list"
    class="booked-list">

</div>

</div>


<hr
    style="
        border:0;
        border-top:1px solid #e2e8f0;
        margin:15px 0;
    ">


<h4
    style="
        margin:0 0 12px;
        color:#4a5568;
    ">

➕ 新增預約

</h4>


<div class="form-group">

<label>
開始時間
</label>


<select
    id="booking-start"
    onchange="updateEndTimeOptions()">

</select>

</div>


<div class="form-group">

<label>
結束時間
</label>


<select
    id="booking-end"
    onchange="updateTimePreview()">

</select>

</div>


<div
    id="time-preview"
    class="time-preview">

請選擇開始與結束時間。

</div>


<div class="form-group">

<label>

預約人姓名
<span style="color:red;">*</span>

</label>


<input
    type="text"
    id="user-name"
    placeholder="請輸入姓名">

</div>


<div class="form-group">

<label>

分機號碼
<span style="color:red;">*</span>

</label>


<input
    type="text"
    id="user-ext"
    placeholder="請輸入分機">

</div>


<div class="warning-text">

⚠️ 預約成功後會產生「取消碼」。
<br>
請務必記下取消碼，之後取消預約會使用到。

</div>


<div class="modal-buttons">


<button
    class="action-btn btn-close"
    onclick="closeModal()">

關閉

</button>


<button
    class="action-btn btn-reserve"
    id="submit-btn"
    onclick="submitBooking()">

確認預約登記

</button>


</div>


</div>

</div>


<!-- ==================================================
     預約成功 Modal
================================================== -->

<div
    class="modal"
    id="success-modal">


<div class="modal-content">


<h3
    style="
        margin-top:0;
        color:#38a169;
    ">

✅ 預約成功

</h3>


<div id="success-booking-info">

</div>


<div class="cancel-code-box">


<div>
您的取消碼
</div>


<div
    id="success-cancel-code"
    class="cancel-code">

</div>


<div
    style="
        font-size:12px;
        color:#4a5568;
    ">

請務必記下這組取消碼

</div>

</div>


<div class="warning-text">

⚠️ 如果之後需要取消預約，
請使用這組取消碼查詢。

</div>


<div class="modal-buttons">


<button
    class="action-btn btn-success"
    onclick="closeSuccessModal()">

我已記下

</button>


</div>


</div>

</div>


<!-- ==================================================
     我的預約 Modal
================================================== -->

<div
    class="modal"
    id="my-booking-modal">


<div class="modal-content">


<h3
    class="modal-title">

🔍 我的預約

</h3>


<div class="form-group">

<label>

請輸入取消碼

</label>


<input
    type="text"
    id="cancel-code-input"
    maxlength="6"
    placeholder="例如：K7M4P2"
    style="
        text-transform:uppercase;
        letter-spacing:2px;
        font-weight:bold;
    ">

</div>


<div class="modal-buttons">


<button
    class="action-btn btn-close"
    onclick="closeMyBookingModal()">

關閉

</button>


<button
    class="action-btn btn-purple"
    id="find-booking-btn"
    onclick="findMyBooking()">

查詢預約

</button>


</div>


<div
    id="my-booking-result"
    style="margin-top:15px;">

</div>


</div>

</div>


<script>


/* ==================================================
   Google Apps Script API
================================================== */

const API_URL =
'https://script.google.com/macros/s/AKfycbwz810c8shFDyfSVcpj-KKNK45D3JEveHAZPR1hp6LgKQ3zn7bW4YWb1aRUVJ6cak9C/exec';


/* ==================================================
   基本設定
================================================== */

const START_HOUR = 7;

const END_HOUR = 18;


let db = {

    "R1-2013": {},

    "R1-3013": {}

};


let currentRoom =
    "R1-2013";


let currentDate =
    new Date();


let activeSelectedDateStr =
    "";


/* ==================================================
   日期
================================================== */

function getDateString(
    year,
    month,
    day
) {

    return (

        year +

        '-' +

        String(month + 1)
            .padStart(2,'0') +

        '-' +

        String(day)
            .padStart(2,'0')

    );

}


function getTodayString() {

    const now =
        new Date();

    return getDateString(

        now.getFullYear(),

        now.getMonth(),

        now.getDate()

    );

}


/* ==================================================
   取得所有預約
================================================== */

async function loadBookings() {

    const grid =
        document.getElementById(
            'calendar-grid'
        );


    grid.innerHTML = `

        <div
            class="loading"
            style="grid-column:1/-1;">

            正在讀取 Google 預約資料...

        </div>

    `;


    try {

        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                'HTTP ' +
                response.status
            );

        }


        const data =
            await response.json();


        db = {

            "R1-2013": {},

            "R1-3013": {}

        };


        data.forEach(item => {

            if (!db[item.room]) {

                db[item.room] = {};

            }


            if (
                !db[item.room][item.date]
            ) {

                db[item.room][item.date] = {};

            }


            db[item.room]
              [item.date]
              [item.time] = {

                name:
                    item.name,

                ext:
                    item.ext

            };

        });


        renderCalendar();


        if (
            activeSelectedDateStr
        ) {

            refreshModalData();

        }


    } catch (error) {

        console.error(error);


        grid.innerHTML = `

            <div
                class="loading"
                style="
                    grid-column:1/-1;
                    color:#e53e3e;
                ">

                ⚠️ 無法讀取 Google 預約資料

                <br><br>

                請確認 Apps Script
                部署與權限。

            </div>

        `;

    }

}


/* ==================================================
   切換會議室
================================================== */

function switchRoom(
    roomName
) {

    currentRoom =
        roomName;


    document
        .querySelectorAll('.tab-btn')
        .forEach(btn => {

            btn.classList.remove(
                'active'
            );

        });


    document
        .getElementById(
            `btn-${roomName}`
        )
        .classList.add(
            'active'
        );


    renderCalendar();

}


/* ==================================================
   月份
================================================== */

function moveMonth(
    direction
) {

    currentDate.setMonth(

        currentDate.getMonth()
        + direction

    );


    renderCalendar();

}


/* ==================================================
   月曆
================================================== */

function renderCalendar() {

    const grid =
        document.getElementById(
            'calendar-grid'
        );


    const title =
        document.getElementById(
            'calendar-month-year'
        );


    grid.innerHTML = '';


    const year =
        currentDate.getFullYear();


    const month =
        currentDate.getMonth();


    title.textContent =

        `${year} 年 ${
            String(month + 1)
                .padStart(2,'0')
        } 月`;


    const weekdays =
        [
            '日',
            '一',
            '二',
            '三',
            '四',
            '五',
            '六'
        ];


    weekdays.forEach(day => {

        const label =
            document.createElement(
                'div'
            );


        label.className =
            'weekday-label';


        label.textContent =
            day;


        grid.appendChild(
            label
        );

    });


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const totalDays =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for (
        let i = 0;
        i < firstDay;
        i++
    ) {

        const empty =
            document.createElement(
                'div'
            );


        empty.className =
            'calendar-day empty';


        grid.appendChild(
            empty
        );

    }


    const today =
        getTodayString();


    const roomData =
        db[currentRoom] || {};


    for (
        let day = 1;
        day <= totalDays;
        day++
    ) {

        const dateStr =
            getDateString(
                year,
                month,
                day
            );


        const cell =
            document.createElement(
                'div'
            );


        cell.className =
            'calendar-day';


        if (
            dateStr === today
        ) {

            cell.classList.add(
                'today'
            );

        }


        const number =
            document.createElement(
                'div'
            );


        number.className =
            'day-number';


        number.textContent =
            day;


        cell.appendChild(
            number
        );


        const events =
            document.createElement(
                'div'
            );


        events.className =
            'event-list';


        const dayData =
            roomData[dateStr] || {};


        Object.keys(dayData)
            .sort()
            .forEach(timeKey => {

                const item =
                    dayData[timeKey];


                const event =
                    document.createElement(
                        'div'
                    );


                event.className =
                    'event-item';


                event.textContent =
                    `${timeKey} ${item.name}`;


                event.title =
                    `${timeKey} ${item.name} / 分機 ${item.ext}`;


                events.appendChild(
                    event
                );

            });


        cell.appendChild(
            events
        );


        cell.onclick =
            () =>
                openBookingModal(
                    dateStr
                );


        grid.appendChild(
            cell
        );

    }

}


/* ==================================================
   開啟預約 Modal
================================================== */

function openBookingModal(
    dateStr
) {

    activeSelectedDateStr =
        dateStr;


    document
        .getElementById(
            'modal-room-display'
        )
        .value =
        currentRoom;


    document
        .getElementById(
            'modal-date-display'
        )
        .value =
        dateStr;


    document
        .getElementById(
            'user-name'
        )
        .value = '';


    document
        .getElementById(
            'user-ext'
        )
        .value = '';


    refreshModalData();


    document
        .getElementById(
            'booking-modal'
        )
        .style.display =
        'flex';

}


/* ==================================================
   取得某日期已預約時段
================================================== */

function getBookedTimes() {

    const roomData =
        db[currentRoom] || {};


    const dayData =
        roomData[
            activeSelectedDateStr
        ] || {};


    return Object.keys(dayData)
        .sort();

}


/* ==================================================
   Modal 資料
================================================== */

function refreshModalData() {

    const list =
        document.getElementById(
            'modal-booked-list'
        );


    list.innerHTML = '';


    const roomData =
        db[currentRoom] || {};


    const dayData =
        roomData[
            activeSelectedDateStr
        ] || {};


    const booked =
        Object.keys(dayData)
            .sort();


    /* 已預約 */

    if (
        booked.length === 0
    ) {

        list.innerHTML =
            '<div style="padding:5px;">本日目前尚無任何預約。</div>';

    } else {

        booked.forEach(
            timeKey => {

                const info =
                    dayData[timeKey];


                const div =
                    document.createElement(
                        'div'
                    );


                div.className =
                    'booked-item';


                div.innerHTML = `

                    <strong>
                        ${timeKey}
                    </strong>

                    -

                    ${escapeHtml(
                        info.name
                    )}

                    （分機：
                    ${escapeHtml(
                        info.ext
                    )}
                    ）

                `;


                list.appendChild(
                    div
                );

            }
        );

    }


    updateStartTimeOptions();

}


/* ==================================================
   開始時間
================================================== */

function updateStartTimeOptions() {

    const startSelect =
        document.getElementById(
            'booking-start'
        );


    startSelect.innerHTML = '';


    const booked =
        getBookedTimes();


    let count = 0;


    for (
        let hour = START_HOUR;
        hour < END_HOUR;
        hour++
    ) {

        const time =
            `${String(hour).padStart(2,'0')}:00`;


        if (
            booked.includes(time)
        ) {

            continue;

        }


        const option =
            document.createElement(
                'option'
            );


        option.value =
            time;


        option.textContent =
            time;


        startSelect.appendChild(
            option
        );


        count++;

    }


    if (count === 0) {

        const option =
            document.createElement(
                'option'
            );


        option.value = '';


        option.textContent =
            '本日已無空閒時段';


        startSelect.appendChild(
            option
        );

    }


    updateEndTimeOptions();

}


/* ==================================================
   結束時間
================================================== */

function updateEndTimeOptions() {

    const startSelect =
        document.getElementById(
            'booking-start'
        );


    const endSelect =
        document.getElementById(
            'booking-end'
        );


    const start =
        startSelect.value;


    endSelect.innerHTML = '';


    if (!start) {

        updateTimePreview();

        return;

    }


    const startHour =
        parseInt(
            start.substring(0,2),
            10
        );


    const booked =
        getBookedTimes();


    /*
     * 結束時間只能選到
     * 第一個被預約時段之前。
     */

    for (
        let hour = startHour + 1;
        hour <= END_HOUR;
        hour++
    ) {

        const previousHour =
            hour - 1;


        const previousTime =
            `${String(previousHour).padStart(2,'0')}:00`;


        if (
            booked.includes(
                previousTime
            )
        ) {

            break;

        }


        const option =
            document.createElement(
                'option'
            );


        option.value =
            `${String(hour).padStart(2,'0')}:00`;


        option.textContent =
            `${String(hour).padStart(2,'0')}:00`;


        endSelect.appendChild(
            option
        );

    }


    updateTimePreview();

}


/* ==================================================
   時間預覽
================================================== */

function updateTimePreview() {

    const start =
        document
            .getElementById(
                'booking-start'
            )
            .value;


    const end =
        document
            .getElementById(
                'booking-end'
            )
            .value;


    const preview =
        document.getElementById(
            'time-preview'
        );


    if (
        !start ||
        !end
    ) {

        preview.innerHTML =
            '請選擇開始與結束時間。';

        return;

    }


    const startHour =
        parseInt(
            start.substring(0,2),
            10
        );


    const endHour =
        parseInt(
            end.substring(0,2),
            10
        );


    const duration =
        endHour - startHour;


    if (
        duration <= 0
    ) {

        preview.innerHTML =
            '⚠️ 結束時間必須晚於開始時間。';

        return;

    }


    preview.innerHTML = `

        本次預約：

        <strong>
            ${start} ～ ${end}
        </strong>

        ，共

        <strong>
            ${duration} 小時
        </strong>

    `;

}


/* ==================================================
   產生連續時段
================================================== */

function buildTimeArray(
    start,
    end
) {

    const result = [];


    const startHour =
        parseInt(
            start.substring(0,2),
            10
        );


    const endHour =
        parseInt(
            end.substring(0,2),
            10
        );


    for (
        let hour = startHour;
        hour < endHour;
        hour++
    ) {

        result.push(

            `${String(hour).padStart(2,'0')}:00`

        );

    }


    return result;

}


/* ==================================================
   預約
================================================== */

async function submitBooking() {

    const start =
        document
            .getElementById(
                'booking-start'
            )
            .value;


    const end =
        document
            .getElementById(
                'booking-end'
            )
            .value;


    const name =
        document
            .getElementById(
                'user-name'
            )
            .value
            .trim();


    const ext =
        document
            .getElementById(
                'user-ext'
            )
            .value
            .trim();


    if (
        !start ||
        !end
    ) {

        alert(
            '請選擇開始與結束時間。'
        );

        return;

    }


    const times =
        buildTimeArray(
            start,
            end
        );


    if (
        times.length === 0
    ) {

        alert(
            '預約時間不正確。'
        );

        return;

    }


    if (
        !name ||
        !ext
    ) {

        alert(
            '請完整填寫姓名與分機！'
        );

        return;

    }


    const button =
        document.getElementById(
            'submit-btn'
        );


    button.disabled = true;

    button.textContent =
        '預約中...';


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: 'POST',

                    body:
                        JSON.stringify({

                            action:
                                'book',

                            room:
                                currentRoom,

                            date:
                                activeSelectedDateStr,

                            times:
                                times,

                            name:
                                name,

                            ext:
                                ext

                        })

                }
            );


        const result =
            await response.json();


        if (
            !result.success
        ) {

            alert(
                result.message
            );


            await loadBookings();


            refreshModalData();


            return;

        }


        /*
         * 關閉預約視窗
         */

        closeModal();


        /*
         * 顯示成功資訊
         */

        showBookingSuccess(
            result
        );


        /*
         * 重新讀取月曆
         */

        await loadBookings();


    } catch (error) {

        console.error(error);


        alert(
            '⚠️ 預約失敗，請確認網路連線。'
        );

    } finally {

        button.disabled = false;

        button.textContent =
            '確認預約登記';

    }

}


/* ==================================================
   顯示預約成功
================================================== */

function showBookingSuccess(
    result
) {

    const info =
        document.getElementById(
            'success-booking-info'
        );


    const code =
        document.getElementById(
            'success-cancel-code'
        );


    const timeText =
        result.times.length > 0

            ? `${result.times[0]} ～ ${
                String(
                    parseInt(
                        result.times[
                            result.times.length - 1
                        ].substring(0,2),
                        10
                    ) + 1
                ).padStart(2,'0')
              }:00`

            : '';


    info.innerHTML = `

        <div style="
            line-height:1.8;
            background:#f8fafc;
            padding:10px;
            border-radius:6px;
        ">

            <strong>
                ${escapeHtml(result.room)}
            </strong>

            <br>

            日期：
            ${escapeHtml(result.date)}

            <br>

            時間：
            <strong>
                ${timeText}
            </strong>

            <br>

            預約人：
            ${escapeHtml(result.name)}

            <br>

            分機：
            ${escapeHtml(result.ext)}

        </div>

    `;


    code.textContent =
        result.cancelCode;


    document
        .getElementById(
            'success-modal'
        )
        .style.display =
        'flex';

}


/* ==================================================
   關閉成功視窗
================================================== */

function closeSuccessModal() {

    document
        .getElementById(
            'success-modal'
        )
        .style.display =
        'none';

}


/* ==================================================
   我的預約
================================================== */

function openMyBookingModal() {

    document
        .getElementById(
            'cancel-code-input'
        )
        .value = '';


    document
        .getElementById(
            'my-booking-result'
        )
        .innerHTML = '';


    document
        .getElementById(
            'my-booking-modal'
        )
        .style.display =
        'flex';


    setTimeout(
        () => {

            document
                .getElementById(
                    'cancel-code-input'
                )
                .focus();

        },
        100
    );

}


/* ==================================================
   關閉我的預約
================================================== */

function closeMyBookingModal() {

    document
        .getElementById(
            'my-booking-modal'
        )
        .style.display =
        'none';

}


/* ==================================================
   查詢我的預約
================================================== */

async function findMyBooking() {

    const input =
        document
            .getElementById(
                'cancel-code-input'
            );


    const resultBox =
        document
            .getElementById(
                'my-booking-result'
            );


    const button =
        document
            .getElementById(
                'find-booking-btn'
            );


    const cancelCode =
        input.value
            .trim()
            .toUpperCase();


    if (
        !cancelCode
    ) {

        alert(
            '請輸入取消碼。'
        );

        return;

    }


    button.disabled = true;

    button.textContent =
        '查詢中...';


    resultBox.innerHTML =
        '<div class="loading">正在查詢...</div>';


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: 'POST',

                    body:
                        JSON.stringify({

                            action:
                                'find',

                            cancelCode:
                                cancelCode

                        })

                }
            );


        const result =
            await response.json();


        if (
            !result.success
        ) {

            resultBox.innerHTML = `

                <div
                    style="
                        color:#e53e3e;
                        background:#fff5f5;
                        padding:10px;
                        border-radius:6px;
                    ">

                    ⚠️
                    ${escapeHtml(
                        result.message
                    )}

                </div>

            `;

            return;

        }


        renderMyBookings(
            result.bookings,
            cancelCode
        );


    } catch (error) {

        console.error(error);


        resultBox.innerHTML = `

            <div style="color:#e53e3e;">

                ⚠️ 查詢失敗，
                請稍後再試。

            </div>

        `;

    } finally {

        button.disabled = false;

        button.textContent =
            '查詢預約';

    }

}


/* ==================================================
   顯示查詢結果
================================================== */

function renderMyBookings(
    bookings,
    cancelCode
) {

    const resultBox =
        document
            .getElementById(
                'my-booking-result'
            );


    resultBox.innerHTML = '';


    bookings.forEach(
        booking => {

            const div =
                document.createElement(
                    'div'
                );


            div.className =
                'booking-result';


            const times =
                booking.times.sort();


            const start =
                times[0];


            const last =
                times[
                    times.length - 1
                ];


            const lastHour =
                parseInt(
                    last.substring(0,2),
                    10
                );


            const end =
                `${String(
                    lastHour + 1
                ).padStart(2,'0')}:00`;


            div.innerHTML = `

                <div
                    class="booking-result-title">

                    ${escapeHtml(
                        booking.room
                    )}

                </div>


                <div>

                    日期：

                    <strong>
                        ${escapeHtml(
                            booking.date
                        )}
                    </strong>

                </div>


                <div
                    class="booking-result-time">

                    ${start}
                    ～ 
                    ${end}

                </div>


                <div
                    class="booking-result-info">

                    預約人：
                    ${escapeHtml(
                        booking.name
                    )}

                    <br>

                    分機：
                    ${escapeHtml(
                        booking.ext
                    )}

                </div>


                <button
                    class="action-btn btn-danger"
                    style="
                        width:100%;
                        margin-top:12px;
                    "
                    onclick="
                        cancelMyBooking(
                            '${booking.bookingId}',
                            '${cancelCode}'
                        )
                    ">

                    🗑️ 取消這筆預約

                </button>

            `;


            resultBox.appendChild(
                div
            );

        }
    );

}


/* ==================================================
   使用者取消
================================================== */

async function cancelMyBooking(
    bookingId,
    cancelCode
) {

    const confirmed =
        confirm(

            '確定要取消這整筆預約嗎？\n\n' +

            '如果是連續多小時預約，' +

            '所有時段都會一起釋放。'

        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: 'POST',

                    body:
                        JSON.stringify({

                            action:
                                'cancel',

                            bookingId:
                                bookingId,

                            cancelCode:
                                cancelCode

                        })

                }
            );


        const result =
            await response.json();


        if (
            !result.success
        ) {

            alert(
                result.message
            );

            return;

        }


        alert(
            '✅ 預約已成功取消。'
        );


        closeMyBookingModal();


        await loadBookings();


    } catch (error) {

        console.error(error);


        alert(
            '⚠️ 取消失敗，請稍後再試。'
        );

    }

}


/* ==================================================
   關閉 Modal
================================================== */

function closeModal() {

    document
        .getElementById(
            'booking-modal'
        )
        .style.display =
        'none';

}


/* ==================================================
   點擊背景關閉
================================================== */

document
    .querySelectorAll('.modal')
    .forEach(modal => {

        modal.addEventListener(
            'click',
            function(event) {

                if (
                    event.target === this
                ) {

                    this.style.display =
                        'none';

                }

            }
        );

    });


/* ==================================================
   防止 XSS
================================================== */

function escapeHtml(
    value
) {

    return String(value)
        .replace(
            /&/g,
            '&amp;'
        )
        .replace(
            /</g,
            '&lt;'
        )
        .replace(
            />/g,
            '&gt;'
        )
        .replace(
            /"/g,
            '&quot;'
        )
        .replace(
            /'/g,
            '&#039;'
        );

}


/* ==================================================
   初始化
================================================== */

loadBookings();

</script>
