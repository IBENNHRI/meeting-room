<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辦公室會議室預約系統 - 月曆版</title>
    <style>
        :root {
            --primary-color: #2b6cb0;
            --booked-bg: #fff5f5;
            --booked-text: #e53e3e;
            --available-color: #48bb78;
            --bg-color: #f7fafc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 15px; color: #2d3748;
        }
        .container {
            max-width: 1000px; margin: 0 auto; background: white;
            padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 20px; font-size: 24px; }
        
        /* 會議室分頁切換 Tabs */
        .room-tabs {
            display: flex; gap: 10px; margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;
        }
        .tab-btn {
            flex: 1; padding: 12px; font-size: 16px; font-weight: bold;
            border: 1px solid #cbd5e0; border-radius: 8px 8px 0 0;
            background: #edf2f7; color: #4a5568; cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary-color); color: white; border-color: var(--primary-color);
        }
        
        /* 月曆控制列 */
        .calendar-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0;
        }
        .calendar-header h2 { margin: 0; font-size: 18px; color: #4a5568; }
        .nav-btn { background: white; border: 1px solid #cbd5e0; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .nav-btn:hover { background: #edf2f7; }

        /* 月曆網格系統 */
        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
        }
        .weekday-label {
            text-align: center; font-weight: bold; padding: 8px 0; background: #edf2f7; color: #718096; border-radius: 4px; font-size: 14px;
        }
        .calendar-day {
            min-height: 110px; border: 1px solid #e2e8f0; border-radius: 6px; padding: 6px;
            background: white; display: flex; flex-direction: column; cursor: pointer; transition: background 0.1s;
        }
        .calendar-day:hover { background: #f7fafc; border-color: #cbd5e0; }
        .calendar-day.empty { background: #fafafa; cursor: default; border: none; }
        .calendar-day.today { border: 2px solid var(--primary-color); background: #f0f7ff; }
        .day-number { font-weight: bold; font-size: 14px; margin-bottom: 5px; color: #4a5568; }
        
        /* 當日預約微縮項目 */
        .event-list { flex-grow: 1; display: flex; flex-direction: column; gap: 3px; overflow-y: auto; max-height: 80px; }
        .event-item {
            font-size: 11px; padding: 2px 4px; border-radius: 3px;
            background-color: var(--booked-bg); color: var(--booked-text);
            border-left: 3px solid var(--booked-text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* 彈出預約視窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
        .action-btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-reserve { background-color: var(--primary-color); color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏢 辦公室會議室預約系統</h1>
    
    <!-- 會議室分頁 -->
    <div class="room-tabs">
        <button class="tab-btn active" id="btn-R1-2013" onclick="switchRoom('R1-2013')">📍 R1-2013 會議室</button>
        <button class="tab-btn" id="btn-R1-3013" onclick="switchRoom('R1-3013')">📍 R1-3013 會議室</button>
    </div>
    
    <!-- 月曆控制列 -->
    <div class="calendar-header">
        <button class="nav-btn" onclick="moveMonth(-1)">◀ 上個月</button>
        <h2 id="calendar-month-year">年 月</h2>
        <button class="nav-btn" onclick="moveMonth(1)">下個月 ▶</button>
    </div>

    <!-- 月曆網格 -->
    <div class="calendar-grid" id="calendar-grid">
        <!-- 由 JavaScript 動態生成 -->
    </div>
</div>
<!-- 預約登錄與詳情彈出視窗 -->
<div class="modal" id="booking-modal">
    <div class="modal-content">
        <h3 id="modal-title" style="margin-top:0; color:var(--primary-color)">預約與狀況</h3>
        <div class="form-group"><label>預約空間</label><input type="text" id="modal-room-display" readonly style="background:#edf2f7;"></div>
        <div class="form-group"><label>預約日期</label><input type="text" id="modal-date-display" readonly style="background:#edf2f7;"></div>
        
        <!-- 當日已有預約列表 -->
        <div class="form-group" style="margin-top: 15px;">
            <label style="color: #e53e3e;">⚠️ 該日已被預約時段 (點擊可刪除/釋放)</label>
            <div id="modal-booked-list" style="max-height: 120px; overflow-y: auto; background: #fff5f5; border: 1px solid #feb2b2; padding: 8px; border-radius: 6px; font-size: 13px; display: flex; flex-direction: column; gap: 5px;">
                <!-- 預約明細 -->
            </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">

        <!-- 新增預約區塊 -->
        <div class="form-group">
            <label for="booking-hour">選擇欲登記時段</label>
            <select id="booking-hour">
                <!-- 由 JS 動態產生 -->
            </select>
        </div>
        <div class="form-group"><label for="user-name">預約人姓名 <span style="color:red;">*</span></label><input type="text" id="user-name" placeholder="請輸入姓名"></div>
        <div class="form-group"><label for="user-ext">分機號碼 <span style="color:red;">*</span></label><input type="text" id="user-ext" placeholder="請輸入分機 (例: 123)"></div>
        
        <div class="modal-buttons">
            <button class="action-btn" style="background:#edf2f7; color:#4a5568;" onclick="closeModal()">關閉</button>
            <button class="action-btn btn-reserve" onclick="submitBooking()">確認預約登記</button>
        </div>
    </div>
</div>

<script>
    const START_HOUR = 7;
    const END_HOUR = 18;
    
    // 初始化資料儲存
    let db = JSON.parse(localStorage.getItem('office_rooms_calendar_v3')) || { "R1-2013": {}, "R1-3013": {} };
    if(!db["R1-2013"]) db["R1-2013"] = {};
    if(!db["R1-3013"]) db["R1-3013"] = {};
    
    let currentRoom = "R1-2013";
    let currentDate = new Date(); 
    let activeSelectedDateStr = ""; 

    // 切換會議室分頁
    function switchRoom(roomName) {
        currentRoom = roomName;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${roomName}`).classList.add('active');
        renderCalendar();
    }

    // 月曆翻頁
    function moveMonth(direction) {
        currentDate.setMonth(currentDate.getMonth() + direction);
        renderCalendar();
    }

    // 渲染整個月份的月曆
    function renderCalendar() {
        const grid = document.getElementById('calendar-grid');
        const monthYearLabel = document.getElementById('calendar-month-year');
        
        grid.innerHTML = '';
        
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();
        
        // 更新上方標題
        monthYearLabel.textContent = `${year} 年 ${String(month + 1).padStart(2, '0')} 月`;
        
        // 建立星期一到日的標頭
        const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
        weekDays.forEach(day => {
            const label = document.createElement('div');
            label.className = 'weekday-label';
            label.textContent = day;
            grid.appendChild(label);
        });

        // 取得本月第一天是星期幾，以及本月總天數
        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        
        // 補足第一天之前的空白格子
        for (let i = 0; i < firstDayIndex; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'calendar-day empty';
            grid.appendChild(emptyCell);
        }

        // 💡 修正後：用本地時區取得今天的日期字串進行比對
        const now = new Date();
        const tzOffset = now.getTimezoneOffset() * 60000;
        const todayStr = (new Date(now - tzOffset)).toISOString().split('T')[0];

        // 開始畫每一天的格子
        for (let day = 1; day <= totalDays; day++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            
            const cell = document.createElement('div');
            cell.className = 'calendar-day';
            if (dateStr === todayStr) cell.classList.add('today');
            
            // 填入日期數字
            const numDiv = document.createElement('div');
            numDiv.className = 'day-number';
            numDiv.textContent = day;
            cell.appendChild(numDiv);

            // 建立預約活動微縮列表
            const eventListDiv = document.createElement('div');
            eventListDiv.className = 'event-list';

            const roomData = db[currentRoom] || {};
            const dayData = roomData[dateStr] || {};

// 排序時段並呈現在月曆格中
const sortedHours = Object.keys(dayData).sort();
sortedHours.forEach(timeKey => {
const item = dayData[timeKey];
const eventItem = document.createElement('div');
eventItem.className = 'event-item';
eventItem.textContent = ${timeKey} ${item.name};
eventItem.title = ${timeKey} 預約人:${item.name} (分機:${item.ext});
eventListDiv.appendChild(eventItem);
});
cell.appendChild(eventListDiv);
// 點擊格子開啟單日詳細預約/狀況視窗
cell.onclick = () => openBookingModal(dateStr);
grid.appendChild(cell);
}
}
// 開啟特定日期的詳細管理彈窗
function openBookingModal(dateStr) {
activeSelectedDateStr = dateStr;
document.getElementById('modal-room-display').value = currentRoom;
document.getElementById('modal-date-display').value = dateStr;
refreshModalData();
document.getElementById('user-name').value = '';
document.getElementById('user-ext').value = '';
document.getElementById('booking-modal').style.display = 'flex';
}
// 重新整理彈出視窗內的預約資訊
function refreshModalData() {
const bookedListContainer = document.getElementById('modal-booked-list');
const hourSelect = document.getElementById('booking-hour');
bookedListContainer.innerHTML = '';
hourSelect.innerHTML = '';
const roomData = db[currentRoom] || {};
const dayData = roomData[activeSelectedDateStr] || {};
const bookedTimes = Object.keys(dayData);
// 1. 顯示已預約清單
if (bookedTimes.length === 0) {
bookedListContainer.innerHTML = '本日目前尚無任何預約。';
} else {
bookedTimes.sort().forEach(timeKey => {
const info = dayData[timeKey];
const div = document.createElement('div');
div.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:white; padding:4px 8px; border-radius:4px; border:1px solid #fee2e2;";
div.innerHTML = <span><strong>${timeKey}</strong> - ${info.name} (分機:${info.ext})</span> <button onclick="deleteBooking('${timeKey}')" style="background:#e53e3e; color:white; border:none; padding:2px 6px; border-radius:4px; cursor:pointer; font-size:11px;">釋放</button>;
bookedListContainer.appendChild(div);
});
}
// 2. 產生尚未被預約的下拉選項 (上午7點到下午6點)
let availableCount = 0;
for (let hour = START_HOUR; hour < END_HOUR; hour++) {
const timeKey = ${String(hour).padStart(2, '0')}:00;
const nextHour = hour + 1;
const timeString = ${timeKey} - ${String(nextHour).padStart(2, '0')}:00;
if (!dayData[timeKey]) {
const opt = document.createElement('option');
opt.value = timeKey;
opt.textContent = timeString;
hourSelect.appendChild(opt);
availableCount++;
}
}
if(availableCount === 0) {
hourSelect.innerHTML = '(本日已無空閒時段)';
}
}
function closeModal() { document.getElementById('booking-modal').style.display = 'none'; }
// 提交新預約
function submitBooking() {
const timeKey = document.getElementById('booking-hour').value;
const name = document.getElementById('user-name').value.trim();
const ext = document.getElementById('user-ext').value.trim();
if (!timeKey) { alert('無可用時段或未選擇時段！'); return; }
if (!name || !ext) { alert('請完整填寫姓名與分機！'); return; }
if (!db[currentRoom][activeSelectedDateStr]) db[currentRoom][activeSelectedDateStr] = {};
// 防撞重複檢查
if (db[currentRoom][activeSelectedDateStr][timeKey]) {
alert('真不巧，該時段剛剛已被搶先登記！');
refreshModalData(); renderCalendar(); return;
}
db[currentRoom][activeSelectedDateStr][timeKey] = { name: name, ext: ext };
localStorage.setItem('office_rooms_calendar_v3', JSON.stringify(db));
alert('預約登記成功！');
refreshModalData();
renderCalendar();
}
// 刪除/釋放預約
function deleteBooking(timeKey) {
event.stopPropagation(); // 防止觸發到外層格子點擊事件
if (confirm(確定要釋放 ${activeSelectedDateStr} ${timeKey} 的會議室預約嗎？)) {
if (db[currentRoom] && db[currentRoom][activeSelectedDateStr] && db[currentRoom][activeSelectedDateStr][timeKey]) {
delete db[currentRoom][activeSelectedDateStr][timeKey];
localStorage.setItem('office_rooms_calendar_v3', JSON.stringify(db));
refreshModalData();
renderCalendar();
}
}
}
// 初始化網頁渲染
renderCalendar();
