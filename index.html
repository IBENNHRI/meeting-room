<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>辦公室會議室預約系統</title>
    <style>
        :root {
            --primary-color: #2b6cb0;
            --booked-color: #e53e3e;
            --available-color: #48bb78;
            --bg-color: #f7fafc;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 15px; color: #2d3748;
        }
        .container {
            max-width: 800px; margin: 0 auto; background: white;
            padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 20px; font-size: 24px; }
        
        /* 會議室分頁切換 Tabs Style */
        .room-tabs {
            display: flex; gap: 10px; margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;
        }
        .tab-btn {
            flex: 1; padding: 12px; font-size: 16px; font-weight: bold;
            border: 1px solid #cbd5e0; border-radius: 8px 8px 0 0;
            background: #edf2f7; color: #4a5568; cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--primary-color); color: white; border-color: var(--primary-color);
        }
        
        .control-panel {
            display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;
        }
        .control-row { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .control-row input { padding: 8px 12px; font-size: 16px; border: 1px solid #cbd5e0; border-radius: 6px; flex-grow: 1; }
        
        .time-grid { display: flex; flex-direction: column; gap: 12px; }
        .time-row { display: flex; align-items: center; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; background: #fff; }
        .time-label { width: 110px; font-weight: bold; font-size: 15px; }
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; color: white; margin-right: 12px; width: 60px; text-align: center; }
        .status-available { background-color: var(--available-color); }
        .status-booked { background-color: var(--booked-color); }
        .info-text { flex-grow: 1; font-size: 14px; }
        
        .action-btn { padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-reserve { background-color: var(--primary-color); color: white; }
        .btn-cancel { background-color: #edf2f7; color: #4a5568; font-size: 13px; }

        /* 彈出視窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏢 辦公室會議室預約系統</h1>
    
    <!-- 分頁切換鈕 -->
    <div class="room-tabs">
        <button class="tab-btn active" onclick="switchRoom('R1-2013')">📍 R1-2013 會議室</button>
        <button class="tab-btn" onclick="switchRoom('R1-3013')">📍 R1-3013 會議室</button>
    </div>
    
    <div class="control-panel">
        <div class="control-row">
            <label for="booking-date">選擇預約日期：</label>
            <input type="date" id="booking-date">
        </div>
    </div>

    <div class="time-grid" id="time-grid">
        <!-- 由 JavaScript 自動生成 -->
    </div>
</div>

<!-- 預約彈出視窗 -->
<div class="modal" id="booking-modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:var(--primary-color)">登記會議室預約</h3>
        <div class="form-group"><label>預約空間</label><input type="text" id="modal-room-display" readonly style="background:#edf2f7;"></div>
        <div class="form-group"><label>預約時段</label><input type="text" id="modal-time-display" readonly style="background:#edf2f7;"></div>
        <div class="form-group"><label for="user-name">預約人姓名 <span style="color:red;">*</span></label><input type="text" id="user-name" placeholder="請輸入姓名" required></div>
        <div class="form-group"><label for="user-ext">分機號碼 <span style="color:red;">*</span></label><input type="text" id="user-ext" placeholder="請輸入分機 (例: 123)" required></div>
        <div class="modal-buttons">
            <button class="action-btn" style="background:#edf2f7; color:#4a5568;" onclick="closeModal()">取消</button>
            <button class="action-btn btn-reserve" onclick="submitBooking()">確認登記</button>
        </div>
    </div>
</div>

<script>
    const START_HOUR = 7;
    const END_HOUR = 18;
    
    // 初始化雲端中端資料存儲（兩間會議室獨立開來）
    let db = JSON.parse(localStorage.getItem('office_rooms_data_v2')) || { "R1-2013": {}, "R1-3013": {} };
    if(!db["R1-2013"]) db["R1-2013"] = {};
    if(!db["R1-3013"]) db["R1-3013"] = {};

    let currentRoom = "R1-2013";
    let currentSelectedHour = null;
    const dateInput = document.getElementById('booking-date');
    const timeGrid = document.getElementById('time-grid');

    // 設定預設日期為今天
    const today = new Date().toISOString().split('T')[0];
    dateInput.value = today;
    dateInput.min = today; 

    dateInput.addEventListener('change', renderTimeSlots);

    // 切換會議室分頁
    function switchRoom(roomName) {
        currentRoom = roomName;
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => {
            if(btn.textContent.includes(roomName)) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        renderTimeSlots();
    }

    // 渲染時間格子
    function renderTimeSlots() {
        const selectedDate = dateInput.value;
        if (!selectedDate) return;

        timeGrid.innerHTML = '';
        // 抓取當前選擇會議室、當前日期的資料
        const roomData = db[currentRoom] || {};
        const dayData = roomData[selectedDate] || {};

        for (let hour = START_HOUR; hour < END_HOUR; hour++) {
            const nextHour = hour + 1;
            const timeKey = `${String(hour).padStart(2, '0')}:00`;
            const timeString = `${String(hour).padStart(2, '0')}:00 - ${String(nextHour).padStart(2, '0')}:00`;
            
            const row = document.createElement('div');
            row.className = 'time-row';

            const timeLabel = document.createElement('div');
            timeLabel.className = 'time-label';
            timeLabel.textContent = timeString;
            row.appendChild(timeLabel);

            const isBooked = dayData[timeKey];
            
            if (isBooked) {
                const badge = document.createElement('span');
                badge.className = 'status-badge status-booked';
                badge.textContent = '已預約';
                row.appendChild(badge);

                const info = document.createElement('div');
                info.className = 'info-text';
                info.innerHTML = `<strong>預約人：</strong>${isBooked.name} &nbsp;&nbsp;|&nbsp;&nbsp; <strong>分機：</strong>${isBooked.ext}`;
                row.appendChild(info);

                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'action-btn btn-cancel';
                cancelBtn.textContent = '釋放';
                cancelBtn.onclick = () => deleteBooking(selectedDate, timeKey);
                row.appendChild(cancelBtn);
            } else {
                const badge = document.createElement('span');
                badge.className = 'status-badge status-available';
                badge.textContent = '空閒';
                row.appendChild(badge);

                const info = document.createElement('div');
                info.className = 'info-text';
                info.style.color = '#a0aec0';
                info.textContent = '點擊右側登記';
                row.appendChild(info);

                const bookBtn = document.createElement('button');
                bookBtn.className = 'action-btn btn-reserve';
                bookBtn.textContent = '預約';
                bookBtn.onclick = () => openModal(hour, timeString);
                row.appendChild(bookBtn);
            }
            timeGrid.appendChild(row);
        }
    }

    function openModal(hour, timeString) {
        currentSelectedHour = hour;
        document.getElementById('modal-room-display').value = currentRoom;
        document.getElementById('modal-time-display').value = `${dateInput.value} (${timeString})`;
        document.getElementById('user-name').value = '';
        document.getElementById('user-ext').value = '';
        document.getElementById('booking-modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('booking-modal').style.display = 'none'; }

    function submitBooking() {
        const name = document.getElementById('user-name').value.trim();
        const ext = document.getElementById('user-ext').value.trim();
        const selectedDate = dateInput.value;
        const timeKey = `${String(currentSelectedHour).padStart(2, '0')}:00`;

        if (!name || !ext) { alert('請填寫姓名與分機！'); return; }

        if (!db[currentRoom][selectedDate]) db[currentRoom][selectedDate] = {};
        
        // 防撞重複檢查
        if (db[currentRoom][selectedDate][timeKey]) {
            alert('該時段已被搶先預約！');
            closeModal(); renderTimeSlots(); return;
        }
